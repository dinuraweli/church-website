backend:
  name: git-gateway
  branch: main  # or "master" depending on your repo

media_folder: "images/uploads"    # Where uploaded images go inside your repo
public_folder: "/images/uploads"  # How they’re referenced in the website

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "index"
        file: "index.html"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Main Content", name: "body", widget: "markdown" }
